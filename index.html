<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Layout concept: a workspace. Top bar, a five-step rail, a persistent deadline strip, then a form column beside live status panels. */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --surface-2:#E9EDF3; --ink:#121B27; --ink-2:#4A5668; --line:#D3DAE5;
  --accent:#2848D4; --accent-ink:#FFFFFF; --accent-soft:#E2E8FC;
  --ok:#157A43; --ok-soft:#DCF1E4; --bad:#B8302A; --bad-soft:#FADFDC; --warn:#8A5700; --warn-soft:#FAEBC6;
  --font-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --font-body:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E141C; --surface:#161F2B; --surface-2:#1F2A39; --ink:#E7ECF3; --ink-2:#9DABBF; --line:#2C394B;
    --accent:#8CA0FF; --accent-ink:#0E141C; --accent-soft:#222E57;
    --ok:#4CC68A; --ok-soft:#14352A; --bad:#FF8F88; --bad-soft:#40201E; --warn:#F2C25B; --warn-soft:#3B2E10;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E141C; --surface:#161F2B; --surface-2:#1F2A39; --ink:#E7ECF3; --ink-2:#9DABBF; --line:#2C394B;
  --accent:#8CA0FF; --accent-ink:#0E141C; --accent-soft:#222E57;
  --ok:#4CC68A; --ok-soft:#14352A; --bad:#FF8F88; --bad-soft:#40201E; --warn:#F2C25B; --warn-soft:#3B2E10;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 64px}
.app{max-width:1160px;margin:0 auto}
h1,h2,h3,h4{font-family:var(--font-display);line-height:1.15;text-wrap:balance;margin:0;font-weight:700}
h1{font-size:1.7rem} h2{font-size:1.25rem} h3{font-size:1.05rem} h4{font-size:.95rem}
p{margin:0}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)} .small{font-size:.85rem}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.brand{font-family:var(--font-display);font-weight:700;font-size:1.25rem;letter-spacing:-.01em}
.brand small{font-family:var(--font-body);font-weight:400;font-size:.8rem;color:var(--ink-2);margin-left:8px}
.grow{flex:1 1 auto;min-width:0}
.saved{font-size:.8rem;color:var(--ink-2)}
.saved.bad{color:var(--bad)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);
  padding:8px 14px;border-radius:6px;cursor:pointer;font-weight:500;line-height:1.2;min-height:38px}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:5px 10px;min-height:30px;font-size:.85rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px;min-width:0}
.panel + .panel{margin-top:16px}
.panel > h2,.panel > h3{margin-bottom:6px}
.panel .lead{color:var(--ink-2);margin-bottom:14px}
.stack{display:grid;gap:16px;min-width:0}
.cols2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:720px){.cols2,.cols3{grid-template-columns:minmax(0,1fr)}}

/* forms */
.field{display:grid;gap:5px;min-width:0}
.field > label,.field > .lab{font-weight:600;font-size:.9rem}
.req{color:var(--bad);margin-left:2px}
.hint{font-size:.82rem;color:var(--ink-2)}
.err{font-size:.82rem;color:var(--bad);font-weight:500}
input[type=text],input[type=date],input[type=time],input[type=url],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);
  border-radius:6px;padding:9px 10px;min-height:38px}
textarea{resize:vertical;line-height:1.45}
input[aria-invalid="true"],textarea[aria-invalid="true"]{border-color:var(--bad)}
input[type=color]{width:44px;height:38px;padding:2px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.check{display:flex;gap:10px;align-items:flex-start}

/* stepper */
.stepper{list-style:none;margin:0 0 12px;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.step{display:flex;align-items:center;gap:8px;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:6px;
  padding:8px 10px;cursor:pointer;text-align:left;min-height:44px}
.step .n{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-mono);font-size:.78rem;
  background:var(--surface-2);font-weight:500}
.step .t{font-weight:600;font-size:.88rem;min-width:0}
.step .t small{display:block;font-weight:400;color:var(--ink-2);font-size:.74rem}
.step.done .n{background:var(--ok);color:var(--surface)}
.step[aria-current="step"]{border-color:var(--accent);box-shadow:inset 0 -3px 0 var(--accent)}
.step[aria-current="step"] .n{background:var(--accent);color:var(--accent-ink)}
@media (max-width:760px){
  .step{justify-content:center;padding:6px}
  .step .t{display:none}
  .step[aria-current="step"] .t{display:none}
  .stepcur{display:block!important}
}
.stepcur{display:none;font-weight:600;margin:0 0 10px}

/* strip */
.strip{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-bottom:16px}
.strip .it{display:grid;min-width:0}
.strip .it span:first-child{font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-2)}
.strip .it span:last-child{font-weight:600;font-size:.9rem}
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:.8rem;font-weight:600;border:1px solid transparent;white-space:nowrap}
.badge.ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.badge.warn{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.badge.bad{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.badge.neutral{background:var(--surface-2);color:var(--ink-2);border-color:var(--line)}
.badge.accent{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.note{border-left:4px solid var(--line);background:var(--surface-2);padding:10px 12px;border-radius:0 6px 6px 0;font-size:.9rem}
.note.ok{border-color:var(--ok);background:var(--ok-soft)}
.note.warn{border-color:var(--warn);background:var(--warn-soft)}
.note.bad{border-color:var(--bad);background:var(--bad-soft)}
.note strong{display:block;margin-bottom:2px}

/* choice buttons */
.choice{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:640px){.choice{grid-template-columns:minmax(0,1fr)}}
.opt{display:grid;gap:4px;text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:8px;padding:14px;cursor:pointer}
.opt span{color:var(--ink-2);font-size:.88rem}
.opt:hover{border-color:var(--ink-2)}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.opt.on strong::before{content:"\2713  "}

/* calendar */
.calwrap{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;margin-top:16px}
@media (max-width:900px){.calwrap{grid-template-columns:minmax(0,1fr)}}
.calhead{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.calhead h3{flex:1;text-align:center;font-size:1.15rem}
.wk,.grid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wk div{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);text-align:center;padding:4px 0}
.cell{position:relative;display:grid;grid-template-rows:auto 1fr;align-content:space-between;min-height:58px;padding:5px 6px;border-radius:4px;
  border:2px solid transparent;cursor:pointer;text-align:left;background:var(--surface-2);line-height:1.1}
.cell.blank{visibility:hidden;border:0;pointer-events:none}
.cell .n{font-family:var(--font-mono);font-weight:500;font-size:.95rem}
.cell .m{display:flex;justify-content:space-between;align-items:flex-end;font-size:.7rem;font-family:var(--font-mono)}
.cell .g{font-weight:700}
.cell.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.cell.no{background:repeating-linear-gradient(135deg,var(--bad-soft) 0 6px,transparent 6px 12px),var(--bad-soft);border-color:transparent;color:var(--bad)}
.cell.past{opacity:.55}
.cell.neutral{color:var(--ink)}
.cell.today{background:var(--surface-2);border:2px dashed var(--ink);color:var(--ink)}
.cell .tg{position:absolute;top:2px;right:4px;font-size:.58rem;text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.cell.sel{outline:3px solid var(--accent);outline-offset:1px}
.cell.sel::after{content:"";position:absolute;left:4px;bottom:4px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.cell.sel .m{padding-left:12px}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:12px;font-size:.82rem}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:16px;height:16px;border-radius:3px;border:2px solid transparent}
.sw.ok{background:var(--ok-soft);border-color:var(--ok)}
.sw.no{background:repeating-linear-gradient(135deg,var(--bad-soft) 0 4px,transparent 4px 8px),var(--bad-soft)}
.sw.today{background:var(--surface-2);border:2px dashed var(--ink)}
.sw.sel{border:3px solid var(--accent);background:transparent}
dl.kv{display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr);gap:6px 14px;margin:0}
dl.kv dt{color:var(--ink-2);font-size:.86rem}
dl.kv dd{margin:0;font-weight:500;min-width:0;overflow-wrap:anywhere}
.chk{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.chk li{display:flex;gap:10px;align-items:flex-start}
.chk .auto{width:18px;height:18px;border-radius:4px;border:2px solid var(--line);display:grid;place-items:center;font-size:.7rem;font-weight:700;flex:none;margin-top:2px}
.chk .auto.y{background:var(--ok);border-color:var(--ok);color:var(--surface)}

/* tags */
.tgrow{display:flex;gap:8px;align-items:center}
.tgrow input{flex:1}

/* SDGs */
.sdgcols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.sdgcols{grid-template-columns:minmax(0,1fr)}}
.sdggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.sdg{position:relative;display:grid;gap:4px;align-content:space-between;min-height:92px;padding:10px;border-radius:6px;cursor:pointer;user-select:none;border:3px solid transparent}
.sdg .num{font-family:var(--font-mono);font-weight:500;font-size:1.3rem;line-height:1}
.sdg .nm{font-weight:600;font-size:.82rem;line-height:1.2}
.sdg.on{border-color:var(--ink)}
.sdg.on::after{content:"\2713 Selected";position:absolute;top:6px;right:8px;font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.dropzone{min-height:140px;border:2px dashed var(--line);border-radius:8px;padding:10px;display:grid;gap:10px;align-content:start}
.dropzone.over{border-color:var(--accent);background:var(--accent-soft)}
.selsdg{border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.selsdg .hd{display:flex;gap:8px;align-items:center;padding:8px 10px}
.selsdg .hd .nm{font-weight:600;font-size:.88rem;flex:1;min-width:0}
.selsdg .bd{padding:8px 10px;display:grid;gap:6px;border-top:1px solid var(--line)}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:.7rem;font-weight:600;border:1px solid var(--line);color:var(--ink-2)}
.sug{display:grid;gap:8px;padding:10px;border:1px dashed var(--accent);border-radius:6px;background:var(--accent-soft)}

/* pubmat */
.types{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.tcard{border:2px solid var(--line);border-radius:6px;padding:10px;background:var(--surface);display:flex;gap:10px;cursor:pointer;align-items:flex-start;text-align:left;width:100%}
.tcard.on{border-color:var(--accent);background:var(--accent-soft)}
.tcard .tick{flex:none;width:18px;height:18px;border:2px solid var(--ink-2);border-radius:4px;display:grid;place-items:center;font-size:.7rem;font-weight:700;margin-top:2px}
.tcard.on .tick{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pmset{border:1px solid var(--line);border-radius:6px;padding:14px;display:grid;gap:12px;background:var(--surface)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:3px 4px 3px 8px;font-size:.85rem;background:var(--surface)}
.chip i{width:14px;height:14px;border-radius:50%;border:1px solid var(--ink-2);display:inline-block}
.chip button{border:0;background:transparent;cursor:pointer;width:22px;height:22px;border-radius:50%;line-height:1}
.chip button:hover{background:var(--surface-2)}

/* output */
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:6px;cursor:pointer;font-weight:600}
.tab[aria-selected="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.pcard{border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden}
.pcard + .pcard{margin-top:16px}
.pcard .ph{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.pcard .pb{padding:14px 16px;display:grid;gap:12px}
.plabel{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-2);font-weight:600}
.prompt{white-space:pre-wrap;font-family:var(--font-mono);font-size:.82rem;line-height:1.55;background:var(--surface-2);border-radius:6px;padding:12px;max-height:380px;overflow:auto;overflow-wrap:anywhere;margin:0}
textarea.prompt{width:100%;max-height:none;border:1px solid var(--accent)}
.sumsec{padding:16px 0;border-top:1px solid var(--line)}
.sumsec:first-of-type{border-top:0;padding-top:0}
.sumsec h3{margin-bottom:10px}

/* dashboard */
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.dcard{display:grid;gap:10px;align-content:space-between}
.dcard .meta{display:grid;gap:3px;font-size:.88rem;color:var(--ink-2)}
.empty{text-align:center;padding:36px 18px;display:grid;gap:12px;justify-items:center}
.empty p{max-width:46ch;color:var(--ink-2)}
textarea.json{font-family:var(--font-mono);font-size:.78rem;min-height:140px}
.navrow{display:flex;justify-content:space-between;gap:10px;margin-top:20px;flex-wrap:wrap}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:6px;font-size:.88rem;font-weight:500;z-index:50;max-width:min(92vw,520px);opacity:0;pointer-events:none;transition:opacity .15s}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>

<script>
'use strict';
// <logic>
const MS_DAY = 86400000;
const pad2 = n => String(n).padStart(2, '0');
const toISO = (y, m, d) => y + '-' + pad2(m) + '-' + pad2(d);
function parseISO(s) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || '');
  if (!m) return null;
  const y = +m[1], mo = +m[2], d = +m[3];
  const dt = new Date(Date.UTC(y, mo - 1, d));
  if (dt.getUTCFullYear() !== y || dt.getUTCMonth() !== mo - 1 || dt.getUTCDate() !== d) return null;
  return { y, m: mo, d };
}
const dayNum = o => Math.round(Date.UTC(o.y, o.m - 1, o.d) / MS_DAY);
function fromDayNum(n) { const dt = new Date(n * MS_DAY); return { y: dt.getUTCFullYear(), m: dt.getUTCMonth() + 1, d: dt.getUTCDate() }; }
const addDays = (o, n) => fromDayNum(dayNum(o) + n);
const diffDays = (a, b) => dayNum(a) - dayNum(b);
const isoOf = o => toISO(o.y, o.m, o.d);
function localToday(now) { now = now || new Date(); return { y: now.getFullYear(), m: now.getMonth() + 1, d: now.getDate() }; }
const daysInMonth = (y, m) => new Date(Date.UTC(y, m, 0)).getUTCDate();
const weekdayOf = o => new Date(Date.UTC(o.y, o.m - 1, o.d)).getUTCDay();
const requiredLead = subsidy => subsidy === true ? 21 : 14;

// Core assessment of one event date against today's date.
function assess(eventObj, subsidy, today) {
  if (!eventObj) return null;
  const req = requiredLead(subsidy);
  const lead = diffDays(eventObj, today);
  const deadline = addDays(eventObj, -req);
  const daysToDeadline = diffDays(deadline, today);
  const eligible = lead >= req;
  let status;
  if (lead <= 0) status = 'late';
  else if (daysToDeadline < 0) status = 'insufficient';
  else if (daysToDeadline <= 3) status = 'approaching';
  else status = 'ontrack';
  return { req, lead, deadline, daysToDeadline, eligible, status, past: lead < 0 };
}
const earliestEligible = (subsidy, today) => addDays(today, requiredLead(subsidy));

const FMT_OPTS = { timeZone: 'UTC' };
const utcDate = o => new Date(Date.UTC(o.y, o.m - 1, o.d));
const fmtLong = o => utcDate(o).toLocaleDateString('en-US', { ...FMT_OPTS, weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
const fmtShort = o => utcDate(o).toLocaleDateString('en-US', { ...FMT_OPTS, weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' });
const fmtMonth = (y, m) => utcDate({ y, m, d: 1 }).toLocaleDateString('en-US', { ...FMT_OPTS, month: 'long', year: 'numeric' });
function fmtTime(t) {
  const m = /^(\d{2}):(\d{2})$/.exec(t || '');
  if (!m) return '';
  let h = +m[1]; const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12;
  return h + ':' + m[2] + ' ' + ap;
}
function fmtRange(a, b) {
  const x = fmtTime(a), y = fmtTime(b);
  if (x && y) return x + ' – ' + y;
  return x || y || '';
}
const plural = (n, w) => n + ' ' + w + (Math.abs(n) === 1 ? '' : 's');
// </logic>

/* ---------- Reference data ---------- */
const SDGS = [
  [1, 'No Poverty', '#E5243B', ['poverty', 'low-income', 'underprivileged', 'livelihood', 'indigent', 'marginalized']],
  [2, 'Zero Hunger', '#DDA63A', ['hunger', 'food', 'nutrition', 'farming', 'agriculture', 'feeding']],
  [3, 'Good Health and Well-being', '#4C9F38', ['health', 'wellness', 'mental', 'medical', 'fitness', 'well-being', 'wellbeing', 'first aid', 'blood']],

function validate(d) {
  const e = {};
  if (d.subsidy === null) e.subsidy = 'Choose whether this event requests a university subsidy.';
  if (!d.title.trim()) e.title = 'Enter the event title.';
  if (!d.theme.trim()) e.theme = 'Enter the event theme.';
  if (!d.date) e.date = 'Pick the event date.';
  if (!d.start) e.start = 'Enter a start time.';
  if (!d.end) e.end = 'Enter an end time.';
  else if (d.start && d.end <= d.start) e.end = 'End time must be later than the start time.';
  if (!d.venue.trim()) e.venue = 'Enter the venue or online platform.';
  if (!d.participants.trim()) e.participants = 'Describe the participants or audience.';
  return e;
}
function stepDone(d, i) {
  if (i === 1) return d.subsidy !== null && !!d.date;
  if (i === 2) { const e = validate(d); delete e.subsidy; delete e.date; return !Object.keys(e).length && !!d.date; }
  if (i === 3) return d.sdgs.length > 0;
  if (i === 4) return Object.keys(d.pm).some(k => d.pm[k].on);

}
const selectedTypes = d => PM_TYPES.filter(t => d.pm[t.k] && d.pm[t.k].on);
function suggestSDGs(d) {
  const text = [d.title, d.theme, d.participants, d.notes, d.inspiration].join(' ').toLowerCase();
  const out = [];
  SDGS.forEach(s => {
    const hits = s.kw.filter(k => text.includes(k));
    if (hits.length && !d.sdgs.some(x => x.n === s.n) && !d.sugRejected.includes(s.n)) out.push({ n: s.n, hits });

}

/* ---------- Step 5: prompts and summary ---------- */

}

function step5(d) {

  },
  tab(t) { ui.tab = t.dataset.v; ui.editing = null; render({ top: true }); },
  copyPrompt(t) { const p = cur().prompts[t.dataset.k]; copyText(p.text, 'Prompt'); },
  editPrompt(t) { ui.editing = t.dataset.k; ui.editText = cur().prompts[t.dataset.k].text; ui.focus = '#editPrompt'; render(); },
  savePrompt(t) { const p = cur().prompts[t.dataset.k]; p.text = ui.editText; p.edited = p.text !== p.original; ui.editing = null; touch(); render(); toast('Prompt saved. Your event details were not changed.'); },
  cancelPrompt() { ui.editing = null; render(); },
  regenPrompt(t) { const d = cur(), k = t.dataset.k, g = genPrompt(d, k); d.prompts[k] = { original: g.prompt, text: g.prompt, edited: false }; ui.editing = null; touch(); render(); toast('Prompt regenerated from the latest details'); },
  resetPrompt(t) { const p = cur().prompts[t.dataset.k]; p.text = p.original; p.edited = false; touch(); render(); toast('Prompt reset to the original'); },
  copySummary(t) {
    const d = cur(), secs = buildSections(d), full = t.dataset.v === 'full';
    const use = full ? secs : secs.filter(s => s.id === 'overview');
    copyText(sectionsToText(use, (d.title.trim() || 'Event') + ' — ' + (full ? 'Event Proposal Summary' : 'Event Details')), full ? 'Full summary' : 'Event details');
  }
};
root.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t || t.disabled) return;
  if (A[t.dataset.act]) A[t.dataset.act](t, e);
});
root.addEventListener('keydown', e => {
  const t = e.target;
  if ((e.key === 'Enter' || e.key === ' ') && t.matches && t.matches('.sdg')) { e.preventDefault(); t.click(); return; }
  if (t.matches && t.matches('.cell') && /^Arrow/.test(e.key)) {
    const cells = Array.from(root.querySelectorAll('.cell:not(.blank)')), i = cells.indexOf(t);
    const step = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -7, ArrowDown: 7 }[e.key], n = cells[i + step];
    if (n) { e.preventDefault(); n.focus(); }
  }
});
function onField(t) {
  const d = cur(); if (!d) return;
  if (t.id === 'editPrompt') { ui.editText = t.value; return; }
  if (t.dataset.sdgx) { const x = d.sdgs.find(s => s.n === +t.dataset.sdgx); if (x) { x.expl = t.value; touch(); } return; }
  if (!t.dataset.bind) return;
  setPath(d, t.dataset.bind, t.type === 'checkbox' ? t.checked : t.value);
  touch();
  if (t.dataset.bind === 'date') { const o = parseISO(d.date); if (o) ui.cal = { y: o.y, m: o.m }; const di = $('#dateInfo'); if (di) di.innerHTML = dateInfoHTML(d); refreshStrip(); }
  if (t.dataset.bind === 'start' || t.dataset.bind === 'end') { const ti = $('#timeInfo'); if (ti) ti.textContent = fmtRange(d.start, d.end) ? 'Time: ' + fmtRange(d.start, d.end) : ''; }
}
root.addEventListener('input', e => onField(e.target));
root.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'impFile' && t.files && t.files[0]) {
    const r = new FileReader(); r.onload = () => { const ta = $('#impText'); if (ta) ta.value = String(r.result || ''); }; r.readAsText(t.files[0]); return;
  }
  onField(t);
});
// Drag and drop into Selected SDGs
root.addEventListener('dragstart', e => { const c = e.target.closest && e.target.closest('.sdg[data-n]'); if (c) { e.dataTransfer.setData('text/plain', 'sdg:' + c.dataset.n); e.dataTransfer.effectAllowed = 'copy'; } });
root.addEventListener('dragover', e => { const z = e.target.closest && e.target.closest('[data-drop="selected"]'); if (z) { e.preventDefault(); z.classList.add('over'); } });
root.addEventListener('dragleave', e => { const z = e.target.closest && e.target.closest('[data-drop="selected"]'); if (z && !z.contains(e.relatedTarget)) z.classList.remove('over'); });
root.addEventListener('drop', e => {
  const z = e.target.closest && e.target.closest('[data-drop="selected"]'); if (!z) return;
  e.preventDefault(); z.classList.remove('over');
  const m = /^sdg:(\d+)$/.exec(e.dataTransfer.getData('text/plain') || ''); if (!m) return;
  const d = cur(), n = +m[1];
  if (d.sdgs.some(x => x.n === n)) { toast('SDG ' + n + ' is already selected'); return; }
  d.sdgs.push({ n, expl: '', src: 'manual' }); touch(); ui.focus = '.sdg[data-n="' + n + '"]'; render();
});
// Keep the calendar correct if the page stays open across midnight
function checkDay() {
  const t = localToday();
  if (diffDays(t, today) !== 0) { today = t; if (ui.view === 'edit') { const d = cur(); const o = d && parseISO(d.date); if (!o) ui.cal = { y: t.y, m: t.m }; } render(); }
}
setInterval(checkDay, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkDay(); });
render();
</script>
